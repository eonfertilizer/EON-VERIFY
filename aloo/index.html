:root{
  /* layout: full-bleed painted field (camera layer) with a floating story card on the reading side, season bar on top, forward button bottom-left */
  --ink:#1E2A1C;
  --ink2:#55604F;
  --card:#FFFCF3;
  --gold:#F2A91B;
  --line:rgba(30,42,28,.12);
  --c-payload:#D3302F;
  --c-nutriphos:#1F8F45;
  --c-prim:#C38A1E;
  --c-sizer:#E9487A;
  --c-phaseup:#EE8A00;
  --c-mingro:#2B44B8;
  --urdu:'Noto Nastaliq Urdu','Archivo','Jameel Noori Nastaleeq',serif;
  --latin:'Archivo','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#7CC6F5;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{font-family:var(--urdu)}
.tint-payload{--pc:var(--c-payload)} .tint-nutriphos{--pc:var(--c-nutriphos)} .tint-prim{--pc:var(--c-prim)} .tint-sizer{--pc:var(--c-sizer)} .tint-phaseup{--pc:var(--c-phaseup)} .tint-mingro{--pc:var(--c-mingro)}

#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#strip{position:relative;z-index:10;margin:clamp(6px,1.6vh,12px) clamp(10px,2vw,20px) 0;background:rgba(255,252,243,.94);border-radius:999px;box-shadow:0 6px 20px -10px rgba(20,60,90,.45);display:flex;align-items:center;gap:clamp(8px,1.4vw,16px);padding:0 clamp(12px,2vw,22px);height:clamp(36px,10vh,54px);backdrop-filter:blur(6px)}
#brand{font-family:var(--latin);font-weight:800;letter-spacing:.2em;font-size:clamp(12px,2.6vh,16px);color:var(--ink);direction:ltr}
#brand i{display:inline-block;width:4px;height:.9em;background:var(--gold);margin-inline-end:3px;vertical-align:-1px;border-radius:2px}
#nodes{flex:1;display:flex;align-items:center;min-width:0}
.node{flex:1;display:flex;align-items:center;gap:6px;background:none;border:0;font:inherit;color:var(--ink2);cursor:pointer;padding:0;min-width:0}
.node::after{content:"";flex:1;height:3px;border-radius:3px;background:var(--line);margin-inline:6px;transition:background .5s}
.node:last-child{flex:none}
.node:last-child::after{display:none}
.node .dot{width:clamp(18px,4.6vh,26px);height:clamp(18px,4.6vh,26px);border-radius:50%;border:2.5px solid color-mix(in srgb,var(--pc) 55%,white);background:#fff;flex:none;display:grid;place-items:center;transition:all .4s;font-family:var(--latin);font-weight:800;font-size:clamp(9px,2vh,12px);color:var(--pc)}
.node .lbl{font-size:clamp(10px,2.4vh,14px);line-height:2;white-space:nowrap}
.node.done .dot{background:var(--pc);border-color:var(--pc);color:#fff}
.node.done::after{background:var(--pc)}
.node.on .dot{background:var(--pc);border-color:#fff;color:#fff;box-shadow:0 0 0 3px var(--pc),0 0 0 8px color-mix(in srgb,var(--pc) 25%,transparent)}
.node.on .lbl{color:var(--ink);font-weight:700}
.node:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:8px}
.ibtn{font:inherit;font-size:clamp(10px,2.3vh,13px);line-height:1;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:999px;height:clamp(26px,6.4vh,36px);padding:0 12px;cursor:pointer;white-space:nowrap}

#stage{position:relative;min-height:0;margin-top:calc(-1 * clamp(42px,11.6vh,66px));overflow:hidden}
#cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#cam canvas,#cam svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
#clouds{width:170%!important;animation:clouds 90s linear infinite alternate}
@keyframes clouds{to{transform:translateX(-28%)}}
#soilHard{-webkit-mask-image:radial-gradient(circle at var(--hx,30%) var(--hy,60%),transparent var(--heal,0px),#000 calc(var(--heal,0px) + 70px));mask-image:radial-gradient(circle at var(--hx,30%) var(--hy,60%),transparent var(--heal,0px),#000 calc(var(--heal,0px) + 70px))}
#field{direction:ltr;touch-action:none}
#cam.dim{filter:saturate(.6) brightness(.8)}
#cam{transition:filter .7s}
#smog{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;opacity:0}
#smog.scratch{pointer-events:auto;touch-action:none}
#fx{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
#ghost{position:absolute;left:0;top:0;width:clamp(40px,11vh,64px);height:auto;opacity:0;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));z-index:2}
#ghostRing{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid #fff;opacity:0}

#card{position:absolute;z-index:5;top:calc(clamp(42px,11.6vh,66px) + clamp(8px,2vh,14px));bottom:clamp(8px,2.4vh,16px);right:clamp(10px,2vw,20px);width:min(45%,560px);background:var(--card);border-radius:clamp(16px,3.4vh,26px);box-shadow:0 18px 40px -18px rgba(20,50,30,.5),0 0 0 1px rgba(255,255,255,.7) inset;display:flex;flex-direction:column;overflow:hidden}
#card::before{content:"";height:clamp(5px,1.2vh,8px);background:var(--pc,var(--gold));flex:none;transition:background .5s}
#cardBody{flex:1;overflow-y:auto;padding:clamp(8px,2.4vh,22px) clamp(14px,2.6vw,30px);display:flex;flex-direction:column;justify-content:safe center;scrollbar-width:none}
#cardBody::-webkit-scrollbar{display:none}
.inner{display:flex;flex-direction:column;gap:clamp(2px,1vh,10px)}
.inner>*{animation:pop .6s cubic-bezier(.2,.9,.25,1.15) both}
.inner>*:nth-child(2){animation-delay:.08s}.inner>*:nth-child(3){animation-delay:.16s}.inner>*:nth-child(4){animation-delay:.24s}.inner>*:nth-child(5){animation-delay:.32s}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
ul.pts li{animation:pop .5s cubic-bezier(.2,.9,.25,1.15) both}
ul.pts li:nth-child(1){animation-delay:.3s}ul.pts li:nth-child(2){animation-delay:.45s}ul.pts li:nth-child(3){animation-delay:.6s}ul.pts li:nth-child(4){animation-delay:.75s}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:clamp(10px,2.4vh,14px);line-height:2;color:var(--ink2)}
.chip{color:#fff;background:var(--pc,var(--gold));border-radius:999px;padding:0 10px;font-weight:700;line-height:2.1}
.tag{font-family:var(--latin);letter-spacing:.18em;font-weight:700;font-size:clamp(9px,2vh,12px);color:var(--pc,#C88400);direction:ltr}
h1{font-weight:700;font-size:clamp(16px,5.2vh,36px);line-height:1.95;text-wrap:balance;color:var(--ink)}
h1.hero{font-size:clamp(24px,8.4vh,58px);line-height:1.8}
h1 em{font-style:normal;color:var(--pc,#C88400)}
.body{font-size:clamp(13px,3.8vh,22px);line-height:2;color:var(--ink2);text-wrap:pretty}
ul.pts{list-style:none;display:flex;flex-direction:column}
ul.pts li{font-size:clamp(13px,3.6vh,21px);line-height:2.05;display:flex;gap:10px;align-items:baseline}
ul.pts li::before{content:"";width:.62em;height:.62em;border-radius:50%;background:var(--pc);flex:none;transform:translateY(-.08em);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 22%,transparent)}
.badge{display:flex;align-items:center;gap:clamp(8px,1.4vw,14px)}
.badge .pk{height:clamp(52px,16vh,104px);width:auto;flex:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.22))}
.badge .nm{font-size:clamp(20px,6.4vh,44px);font-weight:700;line-height:1.7;color:var(--pc)}
.badge .cred{font-family:var(--latin);direction:ltr;font-size:clamp(8px,1.9vh,11px);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);line-height:1.45}
.badge .cred b{display:block;color:var(--ink);font-weight:800;letter-spacing:.16em;font-size:1.2em}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.pill{font:inherit;font-weight:700;font-size:clamp(12px,3vh,17px);border-radius:999px;padding:0 16px;height:clamp(30px,7.6vh,44px);line-height:1;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0}
.pill.solid{color:#fff;background:var(--pc);box-shadow:0 8px 18px -8px var(--pc)}
.pill.ghost{color:var(--ink);background:#fff;border:1.5px solid var(--line)}
.pill small{font-family:var(--latin);font-weight:600;font-size:.68em;opacity:.85;direction:ltr}
.pill:focus-visible,.ibtn:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}
.doit{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--pc) 12%,white);border:2px dashed color-mix(in srgb,var(--pc) 55%,white);border-radius:16px;padding:4px 14px;font-size:clamp(13px,3.6vh,21px);line-height:2;font-weight:700;color:var(--ink)}
.doit svg{width:clamp(22px,5.6vh,34px);height:auto;flex:none;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(-4px,3px)}}
.qmark{width:clamp(36px,10vh,64px);height:clamp(36px,10vh,64px);border-radius:50%;background:var(--pc,var(--gold));color:#fff;display:grid;place-items:center;font-family:var(--latin);font-weight:800;font-size:clamp(22px,6.4vh,40px)}
.q{font-size:clamp(16px,5vh,32px);line-height:2;font-weight:700;text-wrap:balance}
.q.long{font-size:clamp(14px,4.2vh,27px)}
.qhead{display:flex;align-items:center;gap:12px}
.qdots{display:flex;gap:6px}.qdots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:all .3s}.qdots i.on{background:var(--pc,var(--gold));width:22px;border-radius:5px}
.qwrap{display:flex;flex-direction:column;gap:clamp(2px,1vh,8px);align-items:flex-start}
.opener{font-size:clamp(12px,3.2vh,18px);line-height:2;color:var(--ink2);background:color-mix(in srgb,var(--pc) 9%,white);border-radius:14px;padding:2px 12px;border-inline-start:4px solid var(--pc)}
.badge .sub{font-size:clamp(10px,2.6vh,14px);line-height:1.8;color:var(--ink2);margin-top:-4px}
.dense ul.pts li{font-size:clamp(12px,3.3vh,20px);line-height:1.9}
.dense .badge .pk{height:clamp(40px,12vh,84px)}
.dense .badge .nm{font-size:clamp(17px,5vh,36px);line-height:1.6}
.q2{font-size:clamp(13px,3.6vh,21px);line-height:2;color:var(--ink2);border-inline-start:4px solid var(--pc,var(--gold));padding-inline-start:12px}
.chips5{display:flex;flex-wrap:wrap;gap:6px}
.chips5 span{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#fff;border:1.5px solid color-mix(in srgb,var(--pc) 45%,white);padding:0 10px;font-size:clamp(11px,2.9vh,16px);line-height:2}
.chips5 span::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--pc)}
.packs{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(4px,1vw,10px);align-items:end}
.packs button{font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 2px 2px;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-bottom:4px solid var(--pc);transition:transform .2s}
.packs button:active{transform:scale(.95)}
.packs img{height:clamp(36px,11vh,78px);width:auto;filter:drop-shadow(0 4px 5px rgba(0,0,0,.2))}
.packs .s{font-size:clamp(8px,1.9vh,11px);line-height:1.9;color:var(--ink2);white-space:nowrap}
.packs .p{font-size:clamp(10px,2.5vh,15px);line-height:1.8;font-weight:700;color:var(--pc);white-space:nowrap}
.sign{font-family:var(--latin);direction:ltr;letter-spacing:.2em;font-size:clamp(10px,2.3vh,14px);color:var(--ink);font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sign i{width:4px;height:1em;background:var(--gold);border-radius:2px}

#hint{position:absolute;z-index:7;top:calc(clamp(42px,11.6vh,66px) + clamp(10px,2.6vh,18px));left:clamp(10px,2vw,20px);max-width:50%;background:#fff;border-radius:999px;box-shadow:0 10px 24px -12px rgba(0,0,0,.4);padding:0 16px 0 10px;display:flex;align-items:center;gap:8px;font-size:clamp(12px,3.2vh,18px);line-height:2.1;font-weight:700;opacity:0;transform:translateY(-8px);transition:all .4s;pointer-events:none}
#hint.on{opacity:1;transform:none}
#hint b{width:clamp(22px,5.4vh,30px);height:clamp(22px,5.4vh,30px);border-radius:50%;background:var(--pc,var(--gold));display:grid;place-items:center;flex:none}
#hint b svg{width:62%;height:auto}

#nav{position:absolute;z-index:8;left:clamp(10px,2vw,20px);bottom:clamp(8px,2.4vh,16px);display:flex;align-items:center;gap:10px;direction:ltr}
#next{font:inherit;font-weight:700;font-size:clamp(14px,3.8vh,22px);color:#fff;background:var(--ink);border:0;border-radius:999px;height:clamp(40px,11vh,62px);padding:0 clamp(16px,2.6vw,26px);display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 10px 22px -10px rgba(0,0,0,.55);line-height:1}
#next svg{width:1.2em;height:1.2em}
#next.ready{background:var(--pc,var(--ink));animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--pc,#000) 25%,transparent)}}
#back{font:inherit;font-weight:700;font-size:clamp(13px,3.4vh,20px);color:var(--ink);height:clamp(40px,11vh,62px);padding:0 clamp(14px,2.2vw,22px);border-radius:999px;border:2px solid rgba(30,42,28,.15);background:rgba(255,255,255,.95);display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 16px -8px rgba(0,0,0,.5);line-height:1}
#back svg{width:1.1em;height:1.1em}
#back[disabled]{opacity:.35}
#next:focus-visible,#back:focus-visible{outline:3px solid #fff;outline-offset:3px}

.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc)}
.drop{position:absolute;width:7px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff,#8FD4FF 45%,#3B9EE0);}

#sheet{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-start;background:rgba(20,40,30,.35);opacity:0;pointer-events:none;transition:opacity .3s}
#sheet.open{opacity:1;pointer-events:auto}
#sheet .sc{width:min(80%,900px);margin:clamp(8px,2vh,16px);border-radius:24px;background:var(--card);box-shadow:0 20px 50px -20px rgba(0,0,0,.5);padding:clamp(12px,3.4vh,30px) clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:clamp(4px,1.2vh,10px);overflow:auto;transform:translateX(40px);transition:transform .45s cubic-bezier(.2,.9,.25,1.1);border-top:8px solid var(--pc)}
#sheet.open .sc{transform:none}
#sheet .k{font-size:clamp(11px,2.6vh,15px);color:var(--pc);line-height:2;font-weight:700}
#sheet h2{font-size:clamp(17px,4.8vh,30px);line-height:1.9}
#sheet .sci{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:clamp(8px,1.8vh,16px)}
#sheet .sci div{background:#fff;border-radius:16px;padding:6px 14px 8px;border:1.5px solid var(--line)}
#sheet .sci b{display:block;font-size:clamp(12px,3.1vh,18px);line-height:2;color:var(--pc)}
#sheet .sci p{color:var(--ink2);font-size:clamp(11px,2.8vh,16px);line-height:2}
#sheet .pill{align-self:flex-start}

#rotate{position:fixed;inset:0;z-index:40;background:linear-gradient(#6CC8FF,#D8F2FF);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#rotate svg{width:96px;height:96px;animation:tilt 2.2s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate p{font-size:22px;line-height:2;font-weight:700}
@media (orientation:portrait){ body:not(.portrait-ok) #rotate{display:flex} }

/* field svg states (CSS-driven parts) */
#nut circle{fill:#8E836F;opacity:.8;transition:fill .6s,opacity .6s}
#field.nut-free #nut circle{fill:#FFD54F;opacity:1}
#field.nut-free #nut{filter:url(#glow)}
#water g{opacity:0;transition:opacity .8s}
#field.water #water g{opacity:1}
#worms{opacity:0;transition:opacity 1s}
#field.worms #worms{opacity:1}
#plantFx{transition:filter 1.2s}
#field.weak #plantFx{filter:sepia(.55) hue-rotate(-28deg) saturate(.85) brightness(1.06)}
#field.hit #plantFx{filter:sepia(.6) hue-rotate(-50deg) saturate(1.6)}
#sunDisc{transition:fill .9s,opacity .9s}
#field.smoggy #sunDisc{opacity:.45}
#compare{display:none}
#field.compare #compare{display:block}
.chart{width:100%;height:auto;direction:ltr;display:block}
.chart .ln{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.4s .5s cubic-bezier(.4,0,.2,1) forwards}
.chart .ln.b{animation-delay:.9s}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .dt{opacity:0;animation:pop .4s 1.8s forwards}
.cap{font-size:clamp(10px,2.6vh,15px);line-height:1.9;color:var(--ink2)}
.cap .latin{font-family:var(--latin);font-size:.85em;letter-spacing:.04em}
#chalk{opacity:0;transition:opacity .8s}#field.chalk #chalk{opacity:1}
#cnt{position:absolute;z-index:7;left:clamp(10px,2vw,20px);top:50%;transform:translateY(-50%);background:rgba(255,252,243,.95);border-radius:20px;box-shadow:0 10px 24px -12px rgba(0,0,0,.45);padding:4px 16px 2px;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .5s;pointer-events:none}
#cnt.on{opacity:1}
#cnt b{font-family:var(--latin);font-weight:800;font-size:clamp(28px,10vh,52px);line-height:1.1;color:var(--c-nutriphos);display:block}
#cnt span{font-size:clamp(11px,2.8vh,15px);line-height:1.8;color:var(--ink2)}
.svgur{font-family:var(--urdu);font-weight:700;direction:rtl;unicode-bidi:plaintext}
.svgla{font-family:var(--latin);font-weight:800}
@media (prefers-reduced-motion:reduce){ #clouds{animation:none} .inner>*,ul.pts li{animation:none} }
</style>
</head>
<body>
<div id="app">
  <header id="strip">
    <div id="brand"><i></i>EON</div>
    <nav id="nodes" aria-label="سیزن کے مرحلے"></nav>
    <button class="ibtn" id="full" type="button">پوری سکرین</button>
  </header>

  <main id="stage">
    <div id="cam">
      <canvas id="bgA"></canvas>
      <canvas id="bgB"></canvas>
      <canvas id="clouds"></canvas>
      <canvas id="soilRich"></canvas>
      <canvas id="soilHard"></canvas>
      <svg id="field" viewBox="0 0 1000 460" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <radialGradient id="gSun"><stop offset="0" stop-color="#FFFBE6"/><stop offset=".55" stop-color="#FFE68A"/><stop offset="1" stop-color="#FFC93A"/></radialGradient>
          <linearGradient id="gL1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2D7A32"/><stop offset=".6" stop-color="#47A23F"/><stop offset="1" stop-color="#6DBE4E"/></linearGradient>
          <linearGradient id="gL2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#276B2D"/><stop offset=".6" stop-color="#3B9139"/><stop offset="1" stop-color="#5CAE46"/></linearGradient>
          <linearGradient id="gStem" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6A5A35"/><stop offset=".25" stop-color="#4E7F33"/><stop offset="1" stop-color="#4C9A3A"/></linearGradient>
          <radialGradient id="gTn" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#F3DBA6"/><stop offset=".45" stop-color="#DDB574"/><stop offset=".85" stop-color="#B98A4C"/><stop offset="1" stop-color="#8F6333"/></radialGradient>
          <radialGradient id="gTp" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#E2D6BE"/><stop offset=".5" stop-color="#C7B697"/><stop offset=".9" stop-color="#A39274"/><stop offset="1" stop-color="#7E6E54"/></radialGradient>
          <radialGradient id="gTg" cx=".36" cy=".28" r=".8"><stop offset="0" stop-color="#FFEDB8"/><stop offset=".4" stop-color="#F1C76E"/><stop offset=".85" stop-color="#CB9433"/><stop offset="1" stop-color="#9B6A1E"/></radialGradient>
          <pattern id="pSpeck" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="2" r=".6" fill="#6B4A25"/><circle cx="5" cy="5.4" r=".45" fill="#7A5530"/><circle cx="5.6" cy="1" r=".3" fill="#5A3C1E"/></pattern>
          <pattern id="pJute" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 2.5h5M2.5 0v5" stroke="#A88B55" stroke-width="1.1" opacity=".55"/></pattern>
          <radialGradient id="gDome" cx=".5" cy=".75" r=".75"><stop offset="0" stop-color="#F6B7D0" stop-opacity=".05"/><stop offset=".75" stop-color="#E9487A" stop-opacity=".14"/><stop offset="1" stop-color="#E9487A" stop-opacity=".32"/></radialGradient>
          <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
          <clipPath id="clipB"><rect id="clipRect" x="430" y="236" width="700" height="240"/></clipPath>
        </defs>

        <g id="sunG"><circle cx="110" cy="70" r="46" fill="#FFF3C4" opacity=".35" filter="url(#soft)"/><circle id="sunDisc" cx="110" cy="70" r="30" fill="url(#gSun)"/></g>

        <g id="nut"></g>
        <g id="chalk"></g>
        <g id="zinc"></g>
        <g id="edta"></g>
        <g id="water"></g>
        <g id="worms"></g>
        <g id="rootsU" fill="none" stroke="rgba(30,16,6,.5)" stroke-linecap="round"></g>
        <g id="roots" fill="none" stroke="#EEDFC0" stroke-linecap="round"></g>
        <g id="stolons" fill="none" stroke="#E4D0A8" stroke-width="2.2" stroke-linecap="round"></g>
        <g id="tubers"></g>
        <g id="compare">
          <g id="tubA"></g>
          <g id="tubB" clip-path="url(#clipB)"></g>
          <g id="divider">
            <line id="divLine" x1="430" y1="244" x2="430" y2="456" stroke="#fff" stroke-width="4" stroke-dasharray="10 6"/>
            <g id="lbls">
              <rect id="lblAr" x="356" y="254" width="62" height="26" rx="13" fill="rgba(0,0,0,.45)"/>
              <text id="lblA" class="svgur" x="387" y="273" text-anchor="middle" font-size="13" fill="#fff">بغیر</text>
              <rect id="lblBr" x="442" y="254" width="62" height="26" rx="13" fill="#EE8A00"/>
              <text id="lblB" class="svgur" x="473" y="273" text-anchor="middle" font-size="13" fill="#fff">فیزاپ</text>
            </g>
            <g id="handle"><circle id="hC" cx="430" cy="372" r="24" fill="#fff" stroke="#EE8A00" stroke-width="4"/><path id="hA" d="M420 372 l-7 0 m0 0 l6 -6 m-6 6 l6 6 M440 372 l7 0 m0 0 l-6 -6 m6 6 l-6 6" stroke="#1E2A1C" stroke-width="3" stroke-linecap="round" fill="none"/></g>
          </g>
        </g>
        <g id="seedG"></g>

        <g id="plant"><g id="plantFx">
          <g id="stems"></g>
          <g id="fronds"></g>
          <g id="flowers"></g>
        </g></g>

        <g id="dome" opacity="0">
          <path d="M168 238 C168 118 224 48 290 48 C356 48 412 118 412 238" fill="url(#gDome)" stroke="#E9487A" stroke-width="3.2"/>
          <path id="domeHi" d="M190 238 C190 140 232 76 290 72" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".75"/>
        </g>
        <g id="threats"></g>
        <g id="ripples"></g>

        <g id="sack" opacity="0">
          <ellipse cx="474" cy="452" rx="62" ry="8" fill="rgba(0,0,0,.25)"/>
          <path d="M418 328 C410 372 414 420 426 450 L522 450 C534 420 538 372 530 328 C512 316 436 316 418 328Z" fill="#D9C08A"/>
          <path d="M418 328 C410 372 414 420 426 450 L522 450 C534 420 538 372 530 328 C512 316 436 316 418 328Z" fill="url(#pJute)"/>
          <path d="M424 330 C450 342 498 342 524 330" fill="none" stroke="#9C7E48" stroke-width="3"/>
          <g id="sackTop"></g>
          <rect x="440" y="372" width="68" height="32" rx="7" fill="#1E2A1C"/>
          <text x="474" y="394" text-anchor="middle" class="svgla" font-size="15" fill="#F2A91B" letter-spacing="2">EON</text>
        </g>
        <g id="cmp" style="display:none"></g>
        <g id="granules"></g>
        <g id="token" opacity="0"><ellipse id="tokShadow" cx="0" cy="58" rx="30" ry="6" fill="rgba(0,0,0,.25)"/><g id="tokArt"></g></g>
      </svg>
    </div>
    <canvas id="smog"></canvas>
    <div id="fx">
      <div id="ghostRing"></div>
      <svg id="ghost" viewBox="0 0 24 24"><path fill="#fff" stroke="#1E2A1C" stroke-width="1.2" stroke-linejoin="round" d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10h.5V8.5a1.5 1.5 0 0 1 3 0V10h.5V9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.4a1.5 1.5 0 0 1 2.2-2L9 15z"/></svg>
    </div>

    <div id="cnt"><b id="cntN">2</b><span>آلو</span></div>
    <div id="hint"><b><svg viewBox="0 0 24 24" fill="#fff"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10h.5V8.5a1.5 1.5 0 0 1 3 0V10h.5V9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.4a1.5 1.5 0 0 1 2.2-2L9 15z"/></svg></b><span id="hintT"></span></div>
    <section id="card" aria-live="polite"><div id="cardBody"></div></section>
    <div id="nav">
      <button id="back" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="#1E2A1C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>پیچھے</span></button>
      <button id="next" type="button"><span id="nextT">آگے</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </main>
</div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sc"><div class="k" id="sheetK"></div><h2 id="sheetTitle"></h2><div class="sci" id="sheetBody"></div><button class="pill ghost" id="sheetClose" type="button">واپس کہانی پر</button></div>
</div>
<div id="rotate">
  <svg viewBox="0 0 100 100" fill="none" stroke="#1E2A1C" stroke-width="4" stroke-linejoin="round"><rect x="32" y="12" width="36" height="76" rx="6"/><line x1="44" y1="78" x2="56" y2="78"/></svg>
  <p>فون کو ترچھا کر لیں</p>
  <button class="pill ghost" id="portraitOk" type="button">ایسے ہی دیکھیں</button>
</div>
